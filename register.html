<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreeLand - Создание персонажа</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --surface-color: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #ff5722;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .reg-card { width: 100%; max-width: 450px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { font-size: 20px; margin-bottom: 20px; text-align: center; color: var(--text-primary); }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--accent-color); }
        .btn-submit { width: 100%; padding: 14px; background: var(--accent-color); color: white; border: none; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="reg-card">
        <h2>🌲 Создание персонажа</h2>
        <form id="regForm" onsubmit="submitRegistration(event)">
            <div class="form-group">
                <label>ФИО / Имя персонажа</label>
                <input type="text" id="regFio" placeholder="Например: Александр Грин" required>
            </div>
            <div class="form-group">
                <label>Возраст</label>
                <input type="number" id="regAge" placeholder="Например: 25" min="16" max="99" required>
            </div>
            <div class="form-group">
                <label>Пол</label>
                <select id="regGender">
                    <option value="Мужской">Мужской</option>
                    <option value="Женский">Женский</option>
                </select>
            </div>
            <div class="form-group">
                <label>Гражданство</label>
                <input type="text" id="regCitizen" placeholder="Например: США / Местный" required>
            </div>
            <div class="form-group">
                <label>Номер медкарта / Справка</label>
                <input type="text" id="regMed" placeholder="Номер или ссылка на медкарту" required>
            </div>
            <div class="form-group">
                <label>Роспись (Ваша подпись)</label>
                <input type="text" id="regSign" placeholder="Ваша подпись (текстом)" required>
            </div>
            <div class="form-group">
                <label>История персонажа (Био)</label>
                <textarea id="regBio" placeholder="Краткая история жизни..." rows="2" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Отправить на рассмотрение</button>
        </form>
    </div>

    <script>
        function submitRegistration(event) {
            event.preventDefault();

            const BOT_TOKEN = "8996747968:AAGiV1p5kHoy-gQ2YDVknlmD2h3snSVe3sI";
            const CHAT_ID = "-1003913257980";

            const fio = document.getElementById('regFio').value;
            const age = document.getElementById('regAge').value;
            const gender = document.getElementById('regGender').value;
            const citizen = document.getElementById('regCitizen').value;
            const med = document.getElementById('regMed').value;
            const sign = document.getElementById('regSign').value;
            const bio = document.getElementById('regBio').value;

            const message = `📋 <b>НОВАЯ АНКЕТА РП ПЕРСОНАЖА</b>\n\n` +
                            `👤 <b>ФИО:</b> ${fio}\n` +
                            `🎂 <b>Возраст:</b> ${age}\n` +
                            `⚧ <b>Пол:</b> ${gender}\n` +
                            `🌍 <b>Гражданство:</b> ${citizen}\n` +
                            `🏥 <b>Медкарта:</b> ${med}\n` +
                            `✍️ <b>Роспись:</b> ${sign}\n` +
                            `📖 <b>Биография:</b>\n${bio}`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: "✅ Одобрить", callback_data: "app_approve" },
                                { text: "❌ Отклонить", callback_data: "app_reject" }
                            ]
                        ]
                    }
                })
            })
            .then(async res => {
                const data = await res.json();
                if(res.ok && data.ok) {
                    alert("Анкета успешно отправлена администрации!");
                    window.location.href = "social.html";
                } else {
                    alert("Ошибка отправки: " + (data.description || "проверьте бота."));
                }
            })
            .catch(err => {
                console.error(err);
                alert("Ошибка сети при отправке анкеты.");
            });
        }
    </script>
</body>
</html>
