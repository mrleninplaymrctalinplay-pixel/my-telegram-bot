<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация персонажа - GreeLand RP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
        }
        h2 { text-align: center; color: #4CAF50; }
        label { display: block; margin-top: 10px; font-size: 14px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 100px; }
        button {
            width: 100%;
            background-color: #d35400;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background-color: #e67e22; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌲 Регистрация персонажа</h2>
        <form id="regForm">
            <label>ФИО / Имя персонажа:</label>
            <input type="text" id="fio" required placeholder="Например: Александр Грин">

            <label>Возраст:</label>
            <input type="number" id="age" required placeholder="25">

            <label>Пол:</label>
            <select id="gender">
                <option value="Мужской">Мужской</option>
                <option value="Женский">Женский</option>
            </select>

            <label>Роспись (ваша подпись):</label>
            <input type="text" id="sign" required placeholder="J.Doe">

            <label>История персонажа (БИО) — минимум 70 слов:</label>
            <textarea id="bio" required placeholder="Расскажите историю вашего персонажа подробно..."></textarea>
            <span id="wordCount" style="font-size: 12px; color: #888;">Слов: 0 / 70</span>

            <button type="submit" id="submitBtn">ОТПРАВИТЬ НА РАССМОТРЕНИЕ</button>
        </form>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const bioInput = document.getElementById('bio');
        const wordCountSpan = document.getElementById('wordCount');

        bioInput.addEventListener('input', () => {
            const text = bioInput.value.trim();
            const words = text === "" ? 0 : text.split(/\s+/).length;
            wordCountSpan.innerText = `Слов: ${words} / 70`;
            if (words < 70) {
                wordCountSpan.style.color = '#e74c3c';
            } else {
                wordCountSpan.style.color = '#2ecc71';
            }
        });

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const bioText = bioInput.value.trim();
            const wordsCount = bioText === "" ? 0 : bioText.split(/\s+/).length;

            if (wordsCount < 70) {
                alert(`Ошибка: Биография слишком короткая! Нужно минимум 70 слов (сейчас ${wordsCount}).`);
                return;
            }

            const formData = {
                type: "registration",
                user_id: tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 0,
                content: `<b>ФИО:</b> ${document.getElementById('fio').value}\n` +
                         `<b>Возраст:</b> ${document.getElementById('age').value}\n` +
                         `<b>Пол:</b> ${document.getElementById('gender').value}\n` +
                         `<b>Подпись:</b> ${document.getElementById('sign').value}\n` +
                         `<b>Биография:</b> ${bioText}`
            };

            // Ссылка на ваш рабочий сервер Render
            const RENDER_API_URL = 'https://my-telegram-bot-vo4s.onrender.com/api/submit';

            fetch(RENDER_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Анкета успешно отправлена администраторам!');
                    tg.close();
                } else {
                    alert('Ошибка отправки: ' + (data.message || 'Неизвестная ошибка'));
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                alert('Ошибка соединения с сервером.');
            });
        });
    </script>
</body>
</html>
