<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreeLand - Создание персонажа</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #121212;
            --card-color: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #8e8e8e;
            --accent-color: #ff3b30;
            --accent-gradient: linear-gradient(135deg, #ff7a00, #ff007a, #7a00ff);
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .char-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
        }

        .logo-title {
            font-size: 26px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .form-group textarea {
            height: 80px;
            resize: none;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #0095f6;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #1877f2;
        }
    </style>
</head>
<body>

    <div class="char-container">
        <div class="logo-title">Регистрация персонажа</div>
        <div class="subtitle">Заполните данные для мира GreeLand</div>
        
        <form onsubmit="saveCharacter(event)">
            <div class="form-group">
                <label>1. ФИО персонажа</label>
                <input type="text" id="charFio" placeholder="Например: Смирнов Алексей Дмитриевич" required>
            </div>

            <div class="form-group">
                <label>2. Игровой ник / Юзернейм</label>
                <input type="text" id="charNick" placeholder="Например: alex_storm" required>
            </div>

            <div class="form-group">
                <label>3. Роль / Класс</label>
                <select id="charRole">
                    <option value="Искатель">Искатель приключений</option>
                    <option value="Торговец">Торговец</option>
                    <option value="Инженер">Инженер</option>
                    <option value="Исследователь">Исследователь</option>
                </select>
            </div>

            <div class="form-group">
                <label>4. Краткая предыстория</label>
                <textarea id="charBio" placeholder="Например: Родился в северном районе, увлекается технологиями..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Создать персонажа</button>
        </form>
    </div>

    <script>
        function saveCharacter(event) {
            event.preventDefault();
            
            const fio = document.getElementById('charFio').value;
            const nick = document.getElementById('charNick').value;
            
            alert(`Персонаж "${fio}" (@${nick}) успешно зарегистрирован!`);
            
            // Если нужно сразу перенаправлять в ленту (social.html), раскомментируйте строчку ниже:
            // window.location.href = "social.html";
        }
    </script>
</body>
</html>
