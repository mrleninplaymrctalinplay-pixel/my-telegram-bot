<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreeLandID - Регистрация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff9800;
            --border-color: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            color: var(--accent-color);
            margin: 5px 0;
        }
        .form-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }
        .input-field, textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 12px;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .primary-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🌲 Регистрация персонажа</h2>
    </div>

    <div class="form-card">
        <label>ФИО / Имя персонажа:</label>
        <input type="text" id="char-name" class="input-field" placeholder="Александр Грин">

        <label>Возраст:</label>
        <input type="number" id="char-age" class="input-field" placeholder="25">

        <label>Биография / Описание (мин. слова):</label>
        <textarea id="char-bio" placeholder="Расскажите о своем персонаже..."></textarea>
        
        <button class="primary-btn" onclick="submitRegistration()">ОТПРАВИТЬ НА РАССМОТРЕНИЕ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ссылка на ваш бэкенд на Render
        const BACKEND_URL = 'https://greeland-bot.onrender.com';

        function submitRegistration() {
            let name = document.getElementById('char-name').value.trim();
            let age = document.getElementById('char-age').value.trim();
            let bio = document.getElementById('char-bio').value.trim();

            if (!name || !age || !bio) {
                alert("Пожалуйста, заполните все поля!");
                return;
            }

            let user = tg.initDataUnsafe?.user;
            let userId = user ? user.id : 123456789;
            let userName = user ? (user.first_name + (user.username ? ` (@${user.username})` : '')) : 'Игрок';

            let fullText = `🌲 <b>Новая заявка на регистрацию:</b>\n👤 <b>От:</b> ${userName} (ID: <code>${userId}</code>)\n\n📌 <b>Имя:</b> ${name}\n🎂 <b>Возраст:</b> ${age}\n📜 <b>Биография:</b>\n${bio}`;

            fetch(`${BACKEND_URL}/api/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'registration',
                    user_id: userId,
                    content: fullText
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Заявка успешно отправлена администраторам!');
                    tg.close();
                } else {
                    alert('Ошибка отправки. Попробуйте еще раз.');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Ошибка соединения с сервером. Проверьте интернет.');
            });
        }
    </script>
</body>
</html>
