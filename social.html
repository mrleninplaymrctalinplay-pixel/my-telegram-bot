<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GreeLand - Roblox Brookhaven RP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; padding-bottom: 90px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #000; z-index: 10; }
        .logo { font-size: 20px; font-weight: 800; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-create { background: #fff; color: #000; border: none; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); border-top: 1px solid #2c2c2c; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { font-size: 24px; cursor: pointer; opacity: 0.5; padding: 10px; }
        .nav-item.active { opacity: 1; }
        #reg-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .reg-box { width: 100%; max-width: 320px; background: #161616; padding: 24px; border-radius: 16px; border: 1px solid #333; text-align: center; }
        .reg-box input { width: 100%; background: #222; border: 1px solid #333; border-radius: 10px; padding: 10px; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none; text-align: center; }
        .post { margin-bottom: 16px; border-bottom: 1px solid #1a1a1a; padding-bottom: 12px; }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .post-image-container { width: 100%; max-height: 400px; background: #111; overflow: hidden; }
        .post-image { width: 100%; height: 100%; object-fit: cover; display: block; }
        .post-actions { display: flex; gap: 16px; padding: 10px 12px 6px 12px; font-size: 24px; }
        .likes-count { font-size: 13px; font-weight: 600; padding: 0 12px; margin-bottom: 4px; }
        .post-caption { font-size: 13px; padding: 0 12px 8px 12px; color: #ddd; }
        .section-padding { padding: 16px; }
        .profile-card { background: #161616; border: 1px solid #333; padding: 20px; border-radius: 16px; text-align: center; }
        .profile-avatar-big { width: 80px; height: 80px; border-radius: 50%; background: #333; margin: 0 auto 12px auto; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .profile-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); padding: 20px; z-index: 3000; overflow-y: auto; }
        .modal-content { background: #161616; border-radius: 16px; padding: 20px; margin-top: 40px; border: 1px solid #333; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; background: #222; border: 1px solid #333; border-radius: 10px; padding: 10px; color: #fff; font-size: 13px; outline: none; }
        .btn-submit { width: 100%; background: #fff; color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-close { width: 100%; background: transparent; color: #888; border: none; padding: 10px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="reg-screen">
        <div class="reg-box">
            <h2>GreeLand Brookhaven</h2>
            <p style="font-size:12px; color:#888; margin-bottom:12px;">Введите РП-юзернейм (5-12 символов)</p>
            <input type="text" id="reg-input" placeholder="@alex_rp">
            <button class="btn-submit" onclick="registerUser()">Начать игру</button>
        </div>
    </div>

    <div id="screen-feed" class="screen active">
        <div class="header">
            <div class="logo">GreeLand Gram</div>
            <button class="btn-create" onclick="openModal('createModal')">+ Пост</button>
        </div>
        <div id="feed">
            <div class="post">
                <div class="post-header">
                    <div class="user-info">
                        <div class="avatar">GL</div>
                        <div class="username">greeland_official</div>
                    </div>
                </div>
                <div class="post-image-container">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=60" class="post-image">
                </div>
                <div class="post-actions"><span style="cursor:pointer;" onclick="this.innerText = this.innerText === '🤍' ? '❤️' : '🤍'">🤍</span></div>
                <div class="likes-count"><span>124</span> отметка «Нравится»</div>
                <div class="post-caption"><b>greeland_official</b> Сервер Brookhaven 24/7 открыт! 🌴✨</div>
            </div>
        </div>
    </div>

    <div id="screen-profile" class="screen">
        <div class="header"><div class="logo">Профиль</div></div>
        <div class="section-padding">
            <div class="profile-card">
                <div class="profile-avatar-big" id="profile-avatar-view">👤</div>
                <div id="profile-username-view" style="font-weight:bold; margin-bottom:15px;">@user</div>
                <div class="form-group"><label>Ссылка на аватарку (URL):</label><input type="text" id="avatarUrlInput" placeholder="https://..."></div>
                <button class="btn-submit" onclick="saveAvatar()">Сохранить аватарку</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchScreen('feed', this)">🏠</div>
        <div class="nav-item" onclick="switchScreen('profile', this)">👤</div>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <h3>Новый пост</h3>
            <div class="form-group"><label>Ссылка на фото:</label><input type="text" id="postImage" placeholder="https://..."></div>
            <div class="form-group"><label>Описание:</label><textarea id="postCaption" style="width:100%; background:#222; border:1px solid #333; border-radius:10px; padding:10px; color:#fff; height:70px;"></textarea></div>
            <button class="btn-submit" onclick="publishPost()">Опубликовать</button>
            <button class="btn-close" onclick="closeModal('createModal')">Отмена</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentUser = { username: "", avatar: "" };

        window.onload = function() {
            let saved = localStorage.getItem('greeland_username');
            let savedAv = localStorage.getItem('greeland_avatar');
            if (saved) {
                currentUser.username = saved;
                if(savedAv) { currentUser.avatar = savedAv; document.getElementById('profile-avatar-view').innerHTML = `<img src="${savedAv}">`; }
                document.getElementById('profile-username-view').innerText = saved;
                document.getElementById('reg-screen').style.display = 'none';
            }
        };

        function registerUser() {
            let val = document.getElementById('reg-input').value.trim();
            if (val.length < 5) { alert("Минимум 5 символов!"); return; }
            currentUser.username = val.startsWith('@') ? val : '@' + val;
            localStorage.setItem('greeland_username', currentUser.username);
            document.getElementById('profile-username-view').innerText = currentUser.username;
            document.getElementById('reg-screen').style.display = 'none';
        }

        function saveAvatar() {
            let url = document.getElementById('avatarUrlInput').value.trim();
            if(!url) return;
            currentUser.avatar = url;
            localStorage.setItem('greeland_avatar', url);
            document.getElementById('profile-avatar-view').innerHTML = `<img src="${url}">`;
            alert('Аватарка обновлена!');
        }

        function switchScreen(name, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${name}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function publishPost() {
            let img = document.getElementById('postImage').value;
            let cap = document.getElementById('postCaption').value;
            if(!img) { alert("Введите ссылку на фото!"); return; }
            let feed = document.getElementById('feed');
            let avHtml = currentUser.avatar ? `<img src="${currentUser.avatar}">` : currentUser.username.substring(1,3);
            
            let html = `
                <div class="post">
                    <div class="post-header"><div class="user-info"><div class="avatar">${avHtml}</div><div class="username">${currentUser.username}</div></div></div>
                    <div class="post-image-container"><img src="${img}" class="post-image"></div>
                    <div class="post-actions"><span style="cursor:pointer;" onclick="this.innerText = this.innerText === '🤍' ? '❤️' : '🤍'">🤍</span></div>
                    <div class="likes-count"><span>0</span> отметка «Нравится»</div>
                    <div class="post-caption"><b>${currentUser.username}</b> ${cap}</div>
                </div>`;
            feed.insertAdjacentHTML('afterbegin', html);
            closeModal('createModal');
            document.getElementById('postImage').value = '';
            document.getElementById('postCaption').value = '';
        }
    </script>
</body>
</html>
