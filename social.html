<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreeLand Social - Instagram RP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --surface-color: #151a21;
            --surface-hover: #1e2530;
            --accent-pink: #e1306c;
            --accent-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --text-main: #ffffff;
            --text-muted: #8b98a5;
            --border-color: #222b36;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-navbar {
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .tab-content {
            display: none;
            flex: 1;
            padding: 12px;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .profile-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .profile-avatar-wrapper {
            width: 76px;
            height: 76px;
            background: var(--accent-gradient);
            border-radius: 50%;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-avatar-inner {
            width: 100%;
            height: 100%;
            background: var(--surface-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .profile-meta {
            flex: 1;
        }
        .profile-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .profile-tag {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .profile-stats-row {
            display: flex;
            justify-content: space-around;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .stat-box .num {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
        }
        .stat-box .label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .post-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .post-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .post-author-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .post-mini-avatar {
            width: 36px;
            height: 36px;
            background: var(--surface-hover);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .post-author-name {
            font-size: 14px;
            font-weight: bold;
        }
        .post-time {
            font-size: 11px;
            color: var(--text-muted);
        }
        .post-body {
            padding: 16px;
            font-size: 14px;
            line-height: 1.5;
            color: #d8dee9;
            word-break: break-word;
        }
        .post-footer {
            padding: 10px 16px;
            border-top: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .action-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .interaction-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.2s ease, color 0.2s;
            padding: 4px;
        }
        .interaction-btn:active {
            transform: scale(1.35);
        }
        .interaction-btn.liked {
            color: var(--danger-color);
        }

        .create-form-wrapper {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
        }
        .form-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-field, .textarea-field {
            width: 100%;
            padding: 14px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }
        .input-field:focus, .textarea-field:focus {
            border-color: var(--accent-pink);
            outline: none;
        }
        .textarea-field {
            resize: vertical;
            height: 120px;
        }
        .btn-primary {
            width: 100%;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(225, 48, 108, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
            max-width: 480px;
            margin: 0 auto;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: color 0.2s, transform 0.1s;
            padding: 5px 15px;
        }
        .nav-item span {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .nav-item.active {
            color: var(--accent-pink);
        }
        .nav-item:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="top-navbar">
            <div class="logo-text">GreeLand Social</div>
            <div class="top-icons">✨</div>
        </header>

        <section id="tab-feed" class="tab-content active">
            <div id="feed-container">
                <p style="text-align: center; color: var(--text-muted); padding: 40px 0;">Загрузка ленты штата...</p>
            </div>
        </section>

        <section id="tab-create" class="tab-content">
            <div class="create-form-wrapper">
                <div class="form-title">📸 Новая публикация</div>
                <input type="text" id="postAuthorInput" class="input-field" placeholder="Ваш псевдоним или Имя_Фамилия">
                <textarea id="postTextInput" class="textarea-field" placeholder="Поделитесь событиями, фото или мыслями..."></textarea>
                <button class="btn-primary" onclick="publishPost()">Опубликовать в ленту</button>
            </div>
        </section>

        <section id="tab-profile" class="tab-content">
            <div class="profile-card">
                <div class="profile-top">
                    <div class="profile-avatar-wrapper">
                        <div class="profile-avatar-inner">👤</div>
                    </div>
                    <div class="profile-meta">
                        <div class="profile-name" id="profileDisplayName">Игрок GreeLand</div>
                        <div class="profile-tag">@id<span id="profileDisplayId">0</span></div>
                        <div style="font-size: 12px; color: var(--success-color);">🟢 В штате (Online)</div>
                    </div>
                </div>
                <div class="profile-stats-row">
                    <div class="stat-box">
                        <div class="num" id="statPosts">0</div>
                        <div class="label">постов</div>
                    </div>
                    <div class="stat-box">
                        <div class="num">24</div>
                        <div class="label">подписчики</div>
                    </div>
                    <div class="stat-box">
                        <div class="num">18</div>
                        <div class="label">подписки</div>
                    </div>
                </div>
            </div>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('feed', this)">
                🏠<span>Лента</span>
            </button>
            <button class="nav-item" onclick="switchTab('create', this)">
                ➕<span>Создать</span>
            </button>
            <button class="nav-item" onclick="switchTab('profile', this)">
                👤<span>Профиль</span>
            </button>
        </nav>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 998877;
        const userNameTg = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "Гражданин";

        document.getElementById('profileDisplayName').innerText = userNameTg;
        document.getElementById('profileDisplayId').innerText = userId;
        document.getElementById('postAuthorInput').value = userNameTg;

        const RENDER_API_URL = 'https://my-telegram-bot-vo4s.onrender.com';

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');

            if (tabName === 'feed') {
                loadFeedData();
            }
        }

        function loadFeedData() {
            fetch(`${RENDER_API_URL}/api/social/feed`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('feed-container');
                    if (!data.posts || data.posts.length === 0) {
                        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px 0;">В ленте пока нет публикаций. Будьте первыми!</p>';
                        return;
                    }

                    container.innerHTML = '';
                    data.posts.forEach(post => {
                        const postEl = document.createElement('div');
                        postEl.className = 'post-card';
                        postEl.innerHTML = `
                            <div class="post-header">
                                <div class="post-author-info">
                                    <div class="post-mini-avatar">👤</div>
                                    <div>
                                        <div class="post-author-name">${post.author}</div>
                                        <div class="post-time">${post.date}</div>
                                    </div>
                                </div>
                            </div>
                            <div class="post-body">${post.text}</div>
                            <div class="post-footer">
                                <div class="action-group">
                                    <button class="interaction-btn" onclick="likePost(${post.id}, this)">
                                        ❤️ <span id="like-count-${post.id}">${post.likes}</span>
                                    </button>
                                </div>
                                <span style="font-size: 11px; color: var(--text-muted);">GreeLand RP</span>
                            </div>
                        `;
                        container.appendChild(postEl);
                    });
                })
                .catch(() => {
                    document.getElementById('feed-container').innerHTML = '<p style="text-align: center; color: var(--danger-color); padding: 40px 0;">Сервер соцсети просыпается...</p>';
                });
        }

        function publishPost() {
            const author = document.getElementById('postAuthorInput').value.trim();
            const text = document.getElementById('postTextInput').value.trim();

            if (!text) {
                alert('Введите текст публикации!');
                return;
            }

            fetch(`${RENDER_API_URL}/api/social/post`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, author: author, text: text })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('postTextInput').value = '';
                    switchTab('feed', document.querySelector('.nav-item'));
                }
            });
        }

        function likePost(postId, btn) {
            fetch(`${RENDER_API_URL}/api/social/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ post_id: postId, user_id: userId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById(`like-count-${postId}`).innerText = data.likes;
                    btn.classList.add('liked');
                }
            });
        }

        loadFeedData();
    </script>
</body>
</html>
