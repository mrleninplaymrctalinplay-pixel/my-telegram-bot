<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GreeLand - Соцсеть</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; padding-bottom: 70px; }
        
        /* Верхняя шапка */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #000; z-index: 10; }
        .logo { font-size: 20px; font-weight: 800; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-create { background: #fff; color: #000; border: none; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }

        /* Лента постов */
        .post { margin-bottom: 16px; border-bottom: 1px solid #1a1a1a; padding-bottom: 12px; }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: #fff; text-transform: uppercase; }
        .username { font-size: 13px; font-weight: 600; }
        
        .post-image { width: 100%; max-height: 400px; object-fit: cover; background: #111; display: block; }
        
        .post-actions { display: flex; gap: 16px; padding: 10px 12px 6px 12px; font-size: 22px; }
        .post-actions span { cursor: pointer; user-select: none; }
        
        .likes-count { font-size: 13px; font-weight: 600; padding: 0 12px; margin-bottom: 4px; }
        .post-caption { font-size: 13px; padding: 0 12px 8px 12px; line-height: 1.4; color: #ddd; }
        .post-caption b { color: #fff; margin-right: 6px; }

        /* Блок комментариев */
        .comments-section { padding: 0 12px; margin-top: 6px; }
        .comment-item { font-size: 12px; color: #ccc; margin-bottom: 4px; }
        .comment-item b { color: #fff; margin-right: 6px; }
        .add-comment-box { display: flex; gap: 8px; padding: 6px 12px; margin-top: 8px; }
        .add-comment-box input { flex: 1; background: #161616; border: 1px solid #333; border-radius: 8px; padding: 6px 10px; color: #fff; font-size: 12px; }
        .add-comment-box button { background: #333; color: #fff; border: none; border-radius: 8px; padding: 0 12px; font-size: 12px; cursor: pointer; font-weight: 600; }

        /* Модальное окно */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); padding: 20px; z-index: 200; overflow-y: auto; }
        .modal-content { background: #161616; border-radius: 16px; padding: 20px; margin-top: 40px; border: 1px solid #333; }
        .modal-content h3 { margin-bottom: 15px; font-size: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group textarea { width: 100%; background: #222; border: 1px solid #333; border-radius: 10px; padding: 10px; color: #fff; font-size: 13px; }
        .form-group textarea { resize: vertical; height: 80px; }
        .btn-submit { width: 100%; background: #fff; color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; margin-top: 10px; cursor: pointer; }
        .btn-close { width: 100%; background: transparent; color: #888; border: none; padding: 10px; margin-top: 5px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">GreeLand Gram</div>
        <button class="btn-create" onclick="openModal()">+ Пост</button>
    </div>

    <div id="feed">
        <!-- Пример начального поста -->
        <div class="post" id="post-initial">
            <div class="post-header">
                <div class="user-info">
                    <div class="avatar">GL</div>
                    <div class="username">greeland_official</div>
                </div>
            </div>
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=60" class="post-image" alt="Post">
            <div class="post-actions">
                <span onclick="toggleLike(this)">🤍</span>
            </div>
            <div class="likes-count"><span>0</span> отметок «Нравится»</div>
            <div class="post-caption"><b>greeland_official</b> Официальная соцсеть проекта GreeLand открыта! Публикуйте свои кадры 🌴✨</div>
            
            <div class="comments-section" id="comments-initial">
                <div class="comment-item"><b>admin:</b> Добро пожаловать! Наконец-то своя соцсеть.</div>
            </div>
            <div class="add-comment-box">
                <input type="text" placeholder="Добавить комментарий..." id="input-initial" onkeydown="checkEnter(event, 'initial')">
                <button onclick="addComment('initial')">Отправить</button>
            </div>
        </div>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <h3>Новая публикация</h3>
            <div class="form-group">
                <label>Ссылка на фото (URL):</label>
                <input type="text" id="postImage" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Описание:</label>
                <textarea id="postCaption" placeholder="Что нового?"></textarea>
            </div>
            <button class="btn-submit" onclick="publishPost()">Поделиться</button>
            <button class="btn-close" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userTelegram = "player";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let u = tg.initDataUnsafe.user;
            userTelegram = u.username ? `@${u.username}` : u.first_name;
        }

        function openModal() { document.getElementById('createModal').style.display = 'block'; }
        function closeModal() { document.getElementById('createModal').style.display = 'none'; }

        function toggleLike(el) {
            let countContainer = el.closest('.post').querySelector('.likes-count span');
            let currentLikes = parseInt(countContainer.innerText);

            if (el.innerText === '🤍') {
                el.innerText = '❤️';
                countContainer.innerText = currentLikes + 1;
            } else {
                el.innerText = '🤍';
                countContainer.innerText = currentLikes - 1;
            }
        }

        function addComment(postId) {
            let input = document.getElementById(`input-${postId}`);
            let text = input.value.trim();
            if (!text) return;

            let commentsContainer = document.getElementById(`comments-${postId}`);
            let commentDiv = document.createElement('div');
            commentDiv.className = 'comment-item';
            commentDiv.innerHTML = `<b>${userTelegram}:</b> ${text}`;
            
            commentsContainer.appendChild(commentDiv);
            input.value = '';
        }

        function checkEnter(event, postId) {
            if (event.key === 'Enter') {
                addComment(postId);
            }
        }

        function publishPost() {
            let imgUrl = document.getElementById('postImage').value;
            let caption = document.getElementById('postCaption').value;

            if (!imgUrl) { alert("Добавьте ссылку на картинку!"); return; }

            let postId = Date.now();
            let feed = document.getElementById('feed');
            
            let postHtml = `
                <div class="post" id="post-${postId}">
                    <div class="post-header">
                        <div class="user-info">
                            <div class="avatar">${userTelegram.substring(0,2).toUpperCase()}</div>
                            <div class="username">${userTelegram}</div>
                        </div>
                    </div>
                    <img src="${imgUrl}" class="post-image" alt="Post">
                    <div class="post-actions">
                        <span onclick="toggleLike(this)">🤍</span>
                    </div>
                    <div class="likes-count"><span>0</span> отметок «Нравится»</div>
                    <div class="post-caption"><b>${userTelegram}</b> ${caption}</div>
                    
                    <div class="comments-section" id="comments-${postId}"></div>
                    <div class="add-comment-box">
                        <input type="text" placeholder="Добавить комментарий..." id="input-${postId}" onkeydown="checkEnter(event, '${postId}')">
                        <button onclick="addComment('${postId}')">Отправить</button>
                    </div>
                </div>
            `;

            feed.insertAdjacentHTML('afterbegin', postHtml);
            closeModal();
            document.getElementById('postImage').value = '';
            document.getElementById('postCaption').value = '';
        }
    </script>
</body>
</html>
