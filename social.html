<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GreeLand - Соцсеть</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; padding-bottom: 60px; }
        
        /* Верхняя шапка */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #000; z-index: 10; }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-icons span { font-size: 22px; cursor: pointer; }

        /* Лента постов */
        .post { margin-bottom: 16px; border-bottom: 1px solid #1a1a1a; padding-bottom: 12px; }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: #fff; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .username { font-size: 13px; font-weight: 600; }
        
        .post-image { width: 100%; max-height: 400px; object-fit: cover; background: #111; display: block; }
        
        .post-actions { display: flex; gap: 16px; padding: 10px 12px 6px 12px; font-size: 22px; }
        .post-actions span { cursor: pointer; transition: transform 0.1s; }
        .post-actions span:active { transform: scale(1.2); }
        
        .likes-count { font-size: 13px; font-weight: 600; padding: 0 12px; margin-bottom: 4px; }
        .post-caption { font-size: 13px; padding: 0 12px; line-height: 1.4; color: #ddd; }
        .post-caption b { color: #fff; margin-right: 6px; }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { font-size: 24px; cursor: pointer; color: #888; }
        .nav-item.active { color: #fff; }

        /* Модальные окна */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); padding: 20px; z-index: 200; overflow-y: auto; }
        .modal-content { background: #161616; border-radius: 16px; padding: 20px; margin-top: 40px; border: 1px solid #333; }
        .modal-content h3 { margin-bottom: 15px; font-size: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group textarea { width: 100%; background: #222; border: 1px solid #333; border-radius: 10px; padding: 10px; color: #fff; font-size: 13px; }
        .form-group textarea { resize: vertical; height: 80px; }
        .btn-submit { width: 100%; background: #fff; color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; margin-top: 10px; cursor: pointer; }
        .btn-close { width: 100%; background: transparent; color: #888; border: none; padding: 10px; margin-top: 5px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <!-- Верхняя панель -->
    <div class="header">
        <div class="logo">GreeLand</div>
        <div class="header-icons">
            <span onclick="openCreateModal()">➕</span>
        </div>
    </div>

    <!-- Лента постов -->
    <div id="feed">
        <!-- Пример поста -->
        <div class="post">
            <div class="post-header">
                <div class="user-info">
                    <div class="avatar">GL</div>
                    <div class="username">greeland_official</div>
                </div>
                <span style="color: #666; font-size: 14px;">•••</span>
            </div>
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=60" class="post-image" alt="Post">
            <div class="post-actions">
                <span onclick="toggleLike(this)" style="color: #ff3b30;">❤️</span>
                <span>💬</span>
                <span>↗️</span>
            </div>
            <div class="likes-count">1,248 отметок «Нравится»</div>
            <div class="post-caption"><b>greeland_official</b> Добро пожаловать в официальную соцсеть проекта GreeLand! Делитесь своими скриншотами и эмоциями 🌴✨</div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <div class="nav-item active">🏠</div>
        <div class="nav-item" onclick="openCreateModal()">➕</div>
        <div class="nav-item" onclick="alert('Профиль пользователя')">👤</div>
    </div>

    <!-- Модальное окно создания поста -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <h3>Новая публикация</h3>
            <div class="form-group">
                <label>Ссылка на фото (URL):</label>
                <input type="text" id="postImage" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="form-group">
                <label>Описание:</label>
                <textarea id="postCaption" placeholder="Напишите что-нибудь..."></textarea>
            </div>
            <button class="btn-submit" onclick="publishPost()">Поделиться</button>
            <button class="btn-close" onclick="closeCreateModal()">Отмена</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userTelegram = "player";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let u = tg.initDataUnsafe.user;
            userTelegram = u.username || u.first_name;
        }

        function openCreateModal() {
            document.getElementById('createModal').style.display = 'block';
        }

        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
        }

        function toggleLike(el) {
            if (el.style.color === 'rgb(255, 59, 48)') {
                el.style.color = '#fff';
                el.innerText = '🤍';
            } else {
                el.style.color = '#ff3b30';
                el.innerText = '❤️';
            }
        }

        function publishPost() {
            let imgUrl = document.getElementById('postImage').value;
            let caption = document.getElementById('postCaption').value;

            if (!imgUrl) {
                alert("Пожалуйста, добавьте ссылку на картинку!");
                return;
            }

            let feed = document.getElementById('feed');
            let postHtml = `
                <div class="post">
                    <div class="post-header">
                        <div class="user-info">
                            <div class="avatar">${userTelegram.substring(0,2).toUpperCase()}</div>
                            <div class="username">${userTelegram}</div>
                        </div>
                        <span style="color: #666; font-size: 14px;">•••</span>
                    </div>
                    <img src="${imgUrl}" class="post-image" alt="Post">
                    <div class="post-actions">
                        <span onclick="toggleLike(this)">🤍</span>
                        <span>💬</span>
                        <span>↗️</span>
                    </div>
                    <div class="likes-count">1 отметка «Нравится»</div>
                    <div class="post-caption"><b>${userTelegram}</b> ${caption}</div>
                </div>
            `;

            feed.insertAdjacentHTML('afterbegin', postHtml);
            closeCreateModal();

            // Очистка полей
            document.getElementById('postImage').value = '';
            document.getElementById('postCaption').value = '';
        }
    </script>
</body>
</html>
