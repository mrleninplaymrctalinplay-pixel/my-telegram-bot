<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreeLand Gram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff9800;
            --border-color: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
            overflow-x: hidden;
        }

        /* Падающие клёновые листья на заднем плане (не мешают кликам благодаря pointer-events: none) */
        .leaves-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .leaf {
            position: absolute;
            top: -10%;
            width: 22px; height: 22px;
            background: var(--accent-color);
            opacity: 0.5;
            border-radius: 0 50% 50% 50%;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.1; }
        }

        /* Модальное окно выбора языка */
        #lang-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box;
        }
        .lang-btn {
            background: #252525; color: #fff; border: 1px solid var(--accent-color);
            padding: 14px 24px; margin: 8px; width: 80%; max-width: 300px;
            border-radius: 12px; font-size: 16px; cursor: pointer; text-align: center;
        }

        /* Экран регистрации */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 900;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box;
        }
        .auth-card {
            background: var(--card-bg); padding: 25px; border-radius: 16px; width: 100%; max-width: 320px;
            border: 1px solid var(--border-color); text-align: center;
        }
        .auth-input {
            width: 100%; padding: 12px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444;
            color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 16px;
        }
        .primary-btn {
            background: var(--accent-color); color: #000; border: none; padding: 12px 20px;
            font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; font-size: 15px;
        }

        /* Шапка и контент */
        .header {
            padding: 15px; font-size: 20px; font-weight: bold; color: var(--accent-color);
            border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
            position: relative; z-index: 10; background: var(--bg-color);
        }
        .content { padding: 15px; position: relative; z-index: 10; }
        .post-card {
            background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .post-img { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 300px; object-fit: cover; }
        
        /* Нижняя навигация */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background: #1a1a1a; border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item {
            color: #888; text-decoration: none; font-size: 12px; text-align: center; cursor: pointer;
            background: none; border: none; flex: 1;
        }
        .nav-item.active { color: var(--accent-color); }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }

        .hidden { display: none !important; }
        .error-text { color: #ff5252; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Фоновые падающие листья -->
    <div class="leaves-container" id="leaves"></div>

    <!-- 1. Выбор языка -->
    <div id="lang-modal">
        <h2 style="text-align:center; margin-bottom:20px;">Оберіть мову / Тілді таңдаңыз</h2>
        <button class="lang-btn" onclick="setLanguage('ru')">🇷🇺 Русский</button>
        <button class="lang-btn" onclick="setLanguage('uk')">🇺🇦 Українська</button>
        <button class="lang-btn" onclick="setLanguage('kk')">🇰🇿 Қазақша</button>
        <button class="lang-btn" onclick="setLanguage('en')">🇬🇧 English</button>
    </div>

    <!-- 2. Первичная регистрация -->
    <div id="auth-screen" class="hidden">
        <div class="auth-card">
            <h3 id="auth-title">Регистрация</h3>
            <p id="auth-desc" style="font-size: 13px; color: #aaa;">Введите юзернейм (от 5 до 12 символов)</p>
            <input type="text" id="username-input" class="auth-input" placeholder="Username">
            <div id="auth-error" class="error-text"></div>
            <button class="primary-btn" id="auth-btn" onclick="registerUser()">Продолжить</button>
        </div>
    </div>

    <!-- Основной интерфейс соцсети -->
    <div id="main-app" class="hidden">
        <div class="header">
            <span>GreeLand Gram</span>
            <span id="current-user-lbl" style="font-size: 13px; color: var(--accent-color);"></span>
        </div>

        <!-- Лента -->
        <div id="tab-feed" class="content">
            <div id="posts-container"></div>
        </div>

        <!-- Создать пост -->
        <div id="tab-create" class="content hidden">
            <h3 id="create-title">Новая публикация</h3>
            <textarea id="post-text" class="auth-input" placeholder="Что у вас нового?" rows="4" style="resize:none;"></textarea>
            <label style="display:block; margin: 12px 0; font-size: 14px; color: var(--accent-color); cursor:pointer; text-align:center; background:#1e1e1e; padding:10px; border-radius:8px; border:1px dashed var(--accent-color);">
                📷 Прикрепить фото из галереи
                <input type="file" id="post-file" accept="image/*" style="display:none;" onchange="previewImage(this)">
            </label>
            <div id="image-preview-container"></div>
            <button class="primary-btn" onclick="createPost()">Опубликовать</button>
        </div>

        <!-- Профиль -->
        <div id="tab-profile" class="content hidden">
            <div class="post-card" style="text-align: center;">
                <h2 id="profile-username" style="color: var(--accent-color);">User</h2>
                <div style="display: flex; justify-content: space-around; margin: 15px 0;">
                    <div><b id="posts-count">0</b><br><span style="font-size: 12px; color:#888;">Посты</span></div>
                    <div><b id="followers-count">142</b><br><span style="font-size: 12px; color:#888;">Подписчики</span></div>
                    <div><b id="following-count">56</b><br><span style="font-size: 12px; color:#888;">Подписки</span></div>
                </div>
            </div>
        </div>

        <!-- Настройки -->
        <div id="tab-settings" class="content hidden">
            <h3 id="settings-title">Настройки аккаунта</h3>
            <div class="post-card">
                <p id="change-nick-lbl">Изменить никнейм (5-12 символов):</p>
                <input type="text" id="new-username" class="auth-input" placeholder="Новый юзернейм">
                <button class="primary-btn" onclick="updateUsername()">Сохранить</button>
            </div>
            <button class="primary-btn" style="background:#ff5252; color:#fff;" onclick="logout()">Выйти из аккаунта</button>
        </div>

        <!-- Нижняя панель навигации -->
        <div class="nav-bar">
            <button class="nav-item active" onclick="switchTab('feed', this)"><span class="nav-icon">🏠</span>Лента</button>
            <button class="nav-item" onclick="switchTab('create', this)"><span class="nav-icon">➕</span>Создать</button>
            <button class="nav-item" onclick="switchTab('profile', this)"><span class="nav-icon">👤</span>Профиль</button>
            <button class="nav-item" onclick="switchTab('settings', this)"><span class="nav-icon">⚙️</span>Настройки</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentLang = localStorage.getItem('greeland_lang');
        let currentUser = localStorage.getItem('greeland_username');
        let selectedImage = null;

        const translations = {
            ru: { title: "Регистрация", desc: "Введите юзернейм (от 5 до 12 символов)", btn: "Войти", err: "Длина от 5 до 12 символов!", createHead: "Новая публикация", setHead: "Настройки аккаунта", chNick: "Изменить никнейм (5-12 символов):" },
            uk: { title: "Реєстрація", desc: "Введіть юзернейм (від 5 до 12 символів)", btn: "Увійти", err: "Довжина від 5 до 12 символів!", createHead: "Нова публікація", setHead: "Налаштування аккаунта", chNick: "Змінити нікнейм (5-12 символів):" },
            kk: { title: "Тіркелу", desc: "Юзернейм енгізіңіз (5-12 таңба)", btn: "Кіру", err: "Ұзындығы 5 пен 12 аралығында болуы тиіс!", createHead: "Жаңа жарияланым", setHead: "Аккаунт баптаулары", chNick: "Никнеймді өзгерту (5-12 таңба):" },
            en: { title: "Registration", desc: "Enter username (5 to 12 chars)", btn: "Log in", err: "Length must be 5-12 chars!", createHead: "New Post", setHead: "Account Settings", chNick: "Change username (5-12 chars):" }
        };

        function initApp() {
            if (!currentLang) {
                document.getElementById('lang-modal').classList.remove('hidden');
            } else {
                document.getElementById('lang-modal').classList.add('hidden');
                if (!currentUser) {
                    document.getElementById('auth-screen').classList.remove('hidden');
                    applyLanguage();
                } else {
                    document.getElementById('main-app').classList.remove('hidden');
                    updateUserData();
                    loadPosts();
                }
            }
            createLeaves();
        }

        function setLanguage(lang) {
            localStorage.setItem('greeland_lang', lang);
            currentLang = lang;
            document.getElementById('lang-modal').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            applyLanguage();
        }

        function applyLanguage() {
            let t = translations[currentLang] || translations['ru'];
            document.getElementById('auth-title').innerText = t.title;
            document.getElementById('auth-desc').innerText = t.desc;
            document.getElementById('auth-btn').innerText = t.btn;
            document.getElementById('create-title').innerText = t.createHead;
            document.getElementById('settings-title').innerText = t.setHead;
            document.getElementById('change-nick-lbl').innerText = t.chNick;
        }

        function registerUser() {
            let val = document.getElementById('username-input').value.trim();
            let err = document.getElementById('auth-error');
            let t = translations[currentLang] || translations['ru'];

            if (val.length < 5 || val.length > 12) {
                err.innerText = t.err;
                return;
            }
            localStorage.setItem('greeland_username', val);
            currentUser = val;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            updateUserData();
            loadPosts();
        }

        function updateUserData() {
            document.getElementById('current-user-lbl').innerText = "@" + currentUser;
            document.getElementById('profile-username').innerText = "@" + currentUser;
        }

        function logout() {
            localStorage.removeItem('greeland_username');
            location.reload();
        }

        function updateUsername() {
            let val = document.getElementById('new-username').value.trim();
            if (val.length >= 5 && val.length <= 12) {
                localStorage.setItem('greeland_username', val);
                currentUser = val;
                alert("Успешно изменено!");
                location.reload();
            } else {
                alert("Ошибка! Длина от 5 до 12 символов.");
            }
        }

        function createLeaves() {
            const container = document.getElementById('leaves');
            for (let i = 0; i < 14; i++) {
                let leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.style.left = Math.random() * 100 + 'vw';
                leaf.style.animationDuration = (Math.random() * 6 + 4) + 's';
                leaf.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(leaf);
            }
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    selectedImage = e.target.result;
                    document.getElementById('image-preview-container').innerHTML = `<img src="${selectedImage}" style="width:100%; max-height:160px; border-radius:8px; margin-top:10px; object-fit:cover;">`;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            btn.classList.add('active');
        }

        function createPost() {
            let text = document.getElementById('post-text').value.trim();
            if (!text && !selectedImage) return;

            let posts = JSON.parse(localStorage.getItem('greeland_posts') || '[]');
            posts.unshift({ user: currentUser, text: text, image: selectedImage, time: 'Только что' });
            localStorage.setItem('greeland_posts', JSON.stringify(posts));

            document.getElementById('post-text').value = '';
            document.getElementById('post-file').value = '';
            document.getElementById('image-preview-container').innerHTML = '';
            selectedImage = null;

            loadPosts();
            switchTab('feed', document.querySelector('.nav-item'));
        }

        function loadPosts() {
            let posts = JSON.parse(localStorage.getItem('greeland_posts') || '[]');
            let container = document.getElementById('posts-container');
            document.getElementById('posts-count').innerText = posts.filter(p => p.user === currentUser).length;

            if (posts.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777; margin-top:30px;">Нет публикаций</p>';
                return;
            }

            container.innerHTML = posts.map(p => `
                <div class="post-card">
                    <b>@${p.user}</b> <span style="font-size:11px; color:#888; float:right;">${p.time}</span>
                    <p style="margin: 10px 0 5px 0; word-break: break-word;">${p.text || ''}</p>
                    ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                </div>
            `).join('');
        }

        window.onload = initApp;
    </script>
</body>
</html>
