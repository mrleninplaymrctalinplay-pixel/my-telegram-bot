<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обращение / Жалоба - GreeLand RP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
        }
        h2 { text-align: center; color: #e74c3c; }
        label { display: block; margin-top: 10px; font-size: 14px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 120px; }
        button {
            width: 100%;
            background-color: #c0392b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background-color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚠️ Центр жалоб и предложений</h2>
        <form id="complaintForm">
            <label>Тип обращения:</label>
            <select id="complaintType">
                <option value="Жалоба на игрока">👤 Жалоба на игрока</option>
                <option value="Жалоба на администрацию">🛡️ Жалоба на администрацию</option>
                <option value="Предложение по улучшению">💡 Предложение по улучшению</option>
            </select>

            <label>На кого или на что (ник / тема):</label>
            <input type="text" id="target" required placeholder="Например: Nick_Name или суть идеи">

            <label>Подробное описание:</label>
            <textarea id="complaintText" required placeholder="Опишите подробно суть жалобы или вашего предложения..."></textarea>

            <button type="submit">ОТПРАВИТЬ ОБРАЩЕНИЕ</button>
        </form>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('complaintForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const cType = document.getElementById('complaintType').value;
            const targetVal = document.getElementById('target').value;
            const textVal = document.getElementById('complaintText').value;

            const formData = {
                type: "complaint",
                user_id: tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 0,
                content: `<b>Категория:</b> ${cType}\n` +
                         `<b>Объект / Тема:</b> ${targetVal}\n` +
                         `<b>Описание:</b> ${textVal}`
            };

            const RENDER_API_URL = 'https://my-telegram-bot-vo4s.onrender.com/api/submit';

            fetch(RENDER_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Обращение успешно отправлено администраторам!');
                    tg.close();
                } else {
                    alert('Ошибка отправки: ' + (data.message || 'Неизвестная ошибка'));
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                alert('Ошибка соединения с сервером.');
            });
        });
    </script>
</body>
</html>
