<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GreeLand - Жалобы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f0f0f; color: #ffffff; padding: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .title-block h1 { font-size: 18px; font-weight: 700; }
        .title-block p { font-size: 11px; color: #888; letter-spacing: 1px; margin-top: 2px; }
        .btn-add { background-color: #f2f0eb; color: #000; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
        
        /* Фильтры */
        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-chip { background-color: #1a1a1a; color: #aaa; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }
        .filter-chip.active { background-color: #f2f0eb; color: #000; font-weight: 600; }

        /* Карточки */
        .card { background-color: #161616; border: 1px solid #222; border-radius: 14px; padding: 14px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.98); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .avatar-badge { background-color: #222; color: #f2f0eb; font-size: 11px; font-weight: bold; padding: 6px 8px; border-radius: 8px; }
        .username { font-size: 14px; font-weight: 600; }
        
        /* Статусы */
        .status-badge { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
        .status-pending { background-color: #332b1a; color: #d4af37; }
        .status-accepted { background-color: #1b331a; color: #4cd964; }
        .status-rejected { background-color: #331a1a; color: #ff5252; }

        .violation-type { font-size: 12px; color: #888; margin-bottom: 8px; }
        .card-text { font-size: 13px; color: #ccc; line-height: 1.4; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { border-top: 1px solid #222; padding-top: 10px; display: flex; justify-content: space-between; font-size: 11px; color: #777; }
        
        .empty-state { text-align: center; color: #666; font-size: 13px; margin-top: 40px; }

        /* Модальные окна */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); padding: 15px; overflow-y: auto; z-index: 100; }
        .modal-content { background: #161616; border: 1px solid #222; border-radius: 16px; padding: 20px; margin-top: 20px; }
        .modal-content h3 { margin-bottom: 15px; font-size: 16px; color: #f2f0eb; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 10px; color: #fff; font-size: 13px; }
        .form-group textarea { resize: vertical; height: 80px; }
        .btn-submit { width: 100%; background: #f2f0eb; color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; margin-top: 10px; cursor: pointer; }
        .btn-close { width: 100%; background: transparent; color: #888; border: none; padding: 10px; margin-top: 5px; cursor: pointer; font-size: 13px; }

        /* Просмотр конкретной жалобы */
        .detail-row { margin-bottom: 10px; font-size: 13px; }
        .detail-row span { color: #888; font-size: 11px; display: block; }
        .comments-section { margin-top: 15px; border-top: 1px solid #222; padding-top: 12px; }
        .comment-item { background: #1a1a1a; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; }
        .comment-item b { color: #d4af37; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-block">
            <h1>GreeLand</h1>
            <p>ЖАЛОБЫ</p>
        </div>
        <button class="btn-add" onclick="openAddModal()">+ Подать</button>
    </div>

    <!-- Фильтры -->
    <div class="filters" id="filters">
        <button class="filter-chip active" onclick="filterCards('all', this)">Все</button>
        <button class="filter-chip" onclick="filterCards('pending', this)">На рассмотрении</button>
        <button class="filter-chip" onclick="filterCards('accepted', this)">Принято</button>
        <button class="filter-chip" onclick="filterCards('rejected', this)">Отклонено</button>
    </div>

    <!-- Список жалоб (пустой по умолчанию) -->
    <div id="complaints-list">
        <div class="empty-state">Список жалоб пуст. Нажмите «+ Подать», чтобы создать первую.</div>
    </div>

    <!-- Модальное окно подачи жалобы -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3>Подать жалобу</h3>
            <div class="form-group">
                <label>Ваш Telegram:</label>
                <input type="text" id="tgUser" readonly style="color: #888;">
            </div>
            <div class="form-group">
                <label>Ваш ник в игре:</label>
                <input type="text" id="senderNick" placeholder="Ваш ник в игре">
            </div>
            <div class="form-group">
                <label>Ник нарушителя:</label>
                <input type="text" id="targetNick" placeholder="На кого жалоба">
            </div>
            <div class="form-group">
                <label>Опишите ситуацию:</label>
                <textarea id="situation" placeholder="Опишите подробно суть нарушения..."></textarea>
            </div>
            <div class="form-group">
                <label>Ссылка на скриншот (Imgur / фото):</label>
                <input type="text" id="screenshotUrl" placeholder="https://imgur.com/...">
            </div>
            <button class="btn-submit" onclick="submitComplaint()">Отправить жалобу</button>
            <button class="btn-close" onclick="closeModals()">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно просмотра и смены статуса -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <h3 id="detailTitle">Детали жалобы</h3>
            <div class="detail-row">
                <span>Telegram автора:</span>
                <b id="detailTgUser">-</b>
            </div>
            <div class="detail-row">
                <span>Игрок / Нарушитель:</span>
                <b id="detailPlayers">-</b>
            </div>
            <div class="detail-row">
                <span>Описание ситуации:</span>
                <p id="detailText" style="color: #ccc; font-size: 13px; margin-top: 3px; line-height: 1.4;">-</p>
            </div>
            <div class="detail-row" id="screenshotRow" style="display:none;">
                <span>Скриншот:</span>
                <a id="detailScreenshotLink" href="#" target="_blank" style="color: #4da6ff; font-size: 13px;">Открыть ссылку</a>
            </div>
            
            <!-- Изменение статуса -->
            <div class="form-group" style="margin-top: 12px;">
                <label>Статус жалобы:</label>
                <select id="statusSelect" onchange="changeStatus(this.value)">
                    <option value="pending">На рассмотрении</option>
                    <option value="accepted">Принято</option>
                    <option value="rejected">Отклонено</option>
                </select>
            </div>

            <div class="comments-section">
                <span style="color: #888; font-size: 11px; display: block; margin-bottom: 8px;">ОТВЕТЫ И КОММЕНТАРИИ:</span>
                <div id="commentsList">
                    <div class="comment-item"><b>Администратор:</b> Жалоба зарегистрирована.</div>
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <input type="text" id="replyInput" placeholder="Написать ответ...">
                </div>
                <button class="btn-submit" style="margin-top: 5px;" onclick="sendReply()">Отправить ответ</button>
            </div>

            <button class="btn-close" onclick="closeModals()" style="margin-top: 15px;">Закрыть</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userTelegram = "Неизвестно";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let u = tg.initDataUnsafe.user;
            userTelegram = u.username ? `@${u.username}` : `${u.first_name} (ID: ${u.id})`;
        }
        document.getElementById('tgUser').value = userTelegram;

        // Массив жалоб (тестовая начальная или пустой массив)
        let complaints = [
            {
                id: 1,
                telegram: "@admin_greeland",
                sender: "Ivan_Player",
                target: "Violator_User",
                situation: "Игрок использовал баги стрельбы и оскорблял родных в нонРП чате.",
                screenshot: "https://imgur.com/",
                status: "pending",
                date: "08.09.2026",
                comments: ["Администратор: Проверяем предоставленные доказательства."]
            }
        ];

        let currentFilter = 'all';
        let currentComplaintId = null;

        function renderComplaints() {
            let listContainer = document.getElementById('complaints-list');
            listContainer.innerHTML = '';

            let filtered = complaints.filter(c => currentFilter === 'all' || c.status === currentFilter);

            if (filtered.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">Нет жалоб в этой категории.</div>';
                return;
            }

            filtered.forEach(c => {
                let statusText = 'На рассмотрении';
                let statusClass = 'status-pending';
                if (c.status === 'accepted') { statusText = 'Принято'; statusClass = 'status-accepted'; }
                else if (c.status === 'rejected') { statusText = 'Отклонено'; statusClass = 'status-rejected'; }

                let initials = c.target.substring(0, 2).toUpperCase();

                let card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openDetailView(c.id);
                card.innerHTML = `
                    <div class="card-header">
                        <div class="user-info">
                            <div class="avatar-badge">${initials}</div>
                            <div>
                                <div class="username">${c.target}</div>
                                <div style="font-size: 10px; color: #888;">TG: ${c.telegram}</div>
                            </div>
                        </div>
                        <div class="status-badge ${statusClass}">${statusText}</div>
                    </div>
                    <div class="violation-type">От: ${c.sender}</div>
                    <div class="card-text">${c.situation}</div>
                    <div class="card-footer">
                        <span>🕒 ${c.date}</span>
                        <span>💬 ${c.comments.length} ответа(-ов)</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function openAddModal() {
            document.getElementById('addModal').style.display = 'block';
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }

        function openDetailView(id) {
            currentComplaintId = id;
            let c = complaints.find(item => item.id === id);
            if (!c) return;

            document.getElementById('detailTitle').innerText = `Жалоба на ${c.target}`;
            document.getElementById('detailTgUser').innerText = c.telegram;
            document.getElementById('detailPlayers').innerText = `От: ${c.sender} | Нарушитель: ${c.target}`;
            document.getElementById('detailText').innerText = c.situation;
            document.getElementById('statusSelect').value = c.status;

            let ssRow = document.getElementById('screenshotRow');
            let ssLink = document.getElementById('detailScreenshotLink');
            if (c.screenshot && c.screenshot.startsWith('http')) {
                ssLink.href = c.screenshot;
                ssRow.style.display = 'block';
            } else {
                ssRow.style.display = 'none';
            }

            let commentsHtml = '';
            c.comments.forEach(comm => {
                let parts = comm.split(':');
                let author = parts[0];
                let text = parts.slice(1).join(':');
                commentsHtml += `<div class="comment-item"><b>${author}:</b> ${text}</div>`;
            });
            document.getElementById('commentsList').innerHTML = commentsHtml;

            document.getElementById('detailModal').style.display = 'block';
        }

        function changeStatus(newStatus) {
            if (currentComplaintId === null) return;
            let c = complaints.find(item => item.id === currentComplaintId);
            if (c) {
                c.status = newStatus;
                renderComplaints();
            }
        }

        function submitComplaint() {
            const sender = document.getElementById('senderNick').value;
            const target = document.getElementById('targetNick').value;
            const situation = document.getElementById('situation').value;
            const screenshot = document.getElementById('screenshotUrl').value;

            if (!sender || !target || !situation) {
                alert("Пожалуйста, заполните основные поля!");
                return;
            }

            let newComp = {
                id: Date.now(),
                telegram: userTelegram,
                sender: sender,
                target: target,
                situation: situation,
                screenshot: screenshot,
                status: 'pending',
                date: new Date().toLocaleDateString(),
                comments: ["Система: Жалоба успешно создана."]
            };

            complaints.unshift(newComp);
            renderComplaints();
            closeModals();

            // Очистка формы
            document.getElementById('senderNick').value = '';
            document.getElementById('targetNick').value = '';
            document.getElementById('situation').value = '';
            document.getElementById('screenshotUrl').value = '';

            // Если бот запущен в Telegram, можно отправить данные
            try {
                tg.sendData(JSON.stringify({ type: "new_complaint", ...newComp }));
            } catch(e) {}
        }

        function sendReply() {
            const replyText = document.getElementById('replyInput').value;
            if (!replyText || currentComplaintId === null) return;

            let c = complaints.find(item => item.id === currentComplaintId);
            if (c) {
                let commentStr = `Вы (${userTelegram}): ${replyText}`;
                c.comments.push(commentStr);
                
                let commentsList = document.getElementById('commentsList');
                commentsList.innerHTML += `<div class="comment-item"><b>Вы (${userTelegram}):</b> ${replyText}</div>`;
                document.getElementById('replyInput').value = '';
                renderComplaints();
            }
        }

        function filterCards(category, element) {
            document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentFilter = category;
            renderComplaints();
        }

        // Первичный запуск отображения списка
        renderComplaints();
    </script>
</body>
</html>
