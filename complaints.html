<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreeLand // Forum</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff9800;
            --border-color: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .header {
            margin-bottom: 20px;
        }
        .header h2 {
            color: var(--accent-color);
            margin: 0 0 5px 0;
        }
        .header p {
            color: #888;
            font-size: 13px;
            margin: 0;
        }
        .form-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }
        select, textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 12px;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .primary-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>GREE LAND // FORUM</h2>
        <p>Подача жалоб, заявлений и предложений по развитию проекта</p>
    </div>

    <div class="form-card">
        <label>РАЗДЕЛ ФОРУМА:</label>
        <select id="forum-section" onchange="updateTemplate()">
            <option value="player">📁 Жалобы на игроков</option>
            <option value="admin">🛡️ Жалобы на администрацию</option>
            <option value="suggestion">💡 Предложения по улучшению</option>
        </select>

        <label>ТЕКСТ ОБРАЩЕНИЯ / ШАБЛОН:</label>
        <textarea id="forum-content" placeholder="Опишите ситуацию..."></textarea>

        <button class="primary-btn" onclick="submitComplaint()">СОЗДАТЬ ТЕМУ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ссылка на ваш бэкенд на Render
        const BACKEND_URL = 'https://greeland-bot.onrender.com';

        // Уникальные шаблоны для каждого раздела
        const templates = {
            player: 
`1. Ваш никнейм: 
2. Никнейм нарушителя: 
3. Суть жалобы: 
4. Доказательства (видео/скриншоты): `,
            
            admin: 
`1. Ваш никнейм: 
2. Никнейм администратора: 
3. Суть жалобы / в чем несогласны: 
4. Доказательства: `,
            
            suggestion: 
`1. Ваше имя / никнейм: 
2. Суть улучшения / идеи: 
3. Чем это поможет проекту GreeLand RP: `
        };

        function updateTemplate() {
            let section = document.getElementById('forum-section').value;
            document.getElementById('forum-content').value = templates[section] || '';
        }

        window.onload = function() {
            updateTemplate();
        };

        function submitComplaint() {
            let sectionSelect = document.getElementById('forum-section');
            let sectionName = sectionSelect.options[sectionSelect.selectedIndex].text;
            let content = document.getElementById('forum-content').value.trim();

            if (!content) {
                alert("Пожалуйста, заполните текст обращения!");
                return;
            }

            let user = tg.initDataUnsafe?.user;
            let userId = user ? user.id : 123456789;
            let userName = user ? (user.first_name + (user.username ? ` (@${user.username})` : '')) : 'Игрок';

            let fullText = `📌 <b>Раздел:</b> ${sectionName}\n👤 <b>От:</b> ${userName} (ID: <code>${userId}</code>)\n\n${content}`;

            fetch(`${BACKEND_URL}/api/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'complaint',
                    user_id: userId,
                    content: fullText
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Тема успешно создана и отправлена администраторам!');
                    tg.close();
                } else {
                    alert('Ошибка отправки. Попробуйте еще раз.');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Ошибка соединения с сервером.');
            });
        }
    </script>
</body>
</html>
