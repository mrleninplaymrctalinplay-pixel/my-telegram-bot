<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreeLand - Форум жалоб и предложений</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --surface-color: #161920;
            --card-color: #1e222d;
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --accent-red: #e53935;
            --accent-red-hover: #c62828;
            --border-color: #2d333b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        button, input, textarea, select {
            outline: none;
        }

        .forum-container {
            width: 100%;
            max-width: 550px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .forum-header {
            background: var(--card-color);
            padding: 16px 20px;
            border-bottom: 2px solid var(--accent-red);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .forum-header h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .forum-header span {
            font-size: 20px;
        }

        .forum-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: var(--accent-red);
        }

        .form-group textarea {
            height: 120px;
            resize: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--accent-red-hover);
        }

        .rules-hint {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 12px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="forum-container">
        <div class="forum-header">
            <span>🚨</span>
            <h2>Подача жалобы / предложения</h2>
        </div>
        
        <div class="forum-body">
            <form id="reportForm" onsubmit="sendToTelegram(event)">
                
                <div class="form-group">
                    <label>Ваш игровой ник (или ID)</label>
                    <input type="text" id="senderName" placeholder="Например: Alex_Green [#12]" required>
                </div>

                <div class="form-group">
                    <label>Тип обращения</label>
                    <select id="reportType">
                        <option value="Жалоба на игрока">Жалоба на игрока</option>
                        <option value="Жалоба на администрацию">Жалоба на администрацию</option>
                        <option value="Предложение по улучшению">Предложение по улучшению</option>
                        <option value="Баг / Ошибка">Баг / Ошибка</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Нарушитель (если применимо)</label>
                    <input type="text" id="targetUser" placeholder="Имя или ID нарушителя (необязательно)">
                </div>

                <div class="form-group">
                    <label>Суть проблемы / Доказательства (ссылки)</label>
                    <textarea id="reportText" placeholder="Опишите подробно ситуацию, приложите ссылки на видео/скриншоты..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Опубликовать обращение</button>
                
                <div class="rules-hint">
                    Создавая тему, вы подтверждаете достоверность указанной информации. Заведомо ложные данные могут привести к блокировке.
                </div>
            </form>
        </div>
    </div>

    <script>
        function sendToTelegram(event) {
            event.preventDefault();

            const BOT_TOKEN = "8996747986:AAGiV1p5kHoy-gQ2YDVknlmD2h3snSVe3sl"; 
            const CHAT_ID = "-1003913257980";

            const sender = document.getElementById('senderName').value;
            const type = document.getElementById('reportType').value;
            const target = document.getElementById('targetUser').value || "Не указан";
            const text = document.getElementById('reportText').value;

            const message = `🚨 <b>НОВОЕ ОБРАЩЕНИЕ С ФОРУМА</b>\n\n` +
                            `📌 <b>Тип:</b> ${type}\n` +
                            `👤 <b>Отправитель:</b> ${sender}\n` +
                            `🎯 <b>Нарушитель:</b> ${target}\n\n` +
                            `💬 <b>Описание:</b>\n${text}`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            })
            .then(response => {
                if (response.ok) {
                    alert("Ваше обращение успешно отправлено на рассмотрение администрации!");
                    document.getElementById('reportForm').reset();
                } else {
                    alert("Ошибка при отправке. Убедитесь, что бот добавлен в группу `-1003913257980`.");
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                alert("Не удалось отправить сообщение. Проверьте интернет-соединение.");
            });
        }
    </script>
</body>
</html>
