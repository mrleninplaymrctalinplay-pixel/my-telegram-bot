<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreeLand Social - Инстаграм</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b22;
            --accent-color: #e1306c; /* Инстаграмовский розово-красный акцент */
            --accent-hover: #c12258;
            --text-main: #ffffff;
            --text-muted: #8a9ba8;
            --border-color: #262b36;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        /* Профиль шапка */
        .profile-header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            padding: 2px;
        }
        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #181b22;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stats {
            display: flex;
            gap: 12px;
            text-align: center;
            font-size: 12px;
        }
        .stat-num {
            font-weight: bold;
            font-size: 15px;
            color: var(--text-main);
        }
        /* Создание поста */
        .create-post {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        textarea, input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #0f1115;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        textarea:focus, input:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.2s, transform 0.1s ease;
        }
        /* Микро-анимация клика для всех кнопок */
        button:active {
            transform: scale(0.96);
        }
        button:hover { 
            background-color: var(--accent-hover); 
        }
        /* Посты (Карточки ленты) */
        .post {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .post-author {
            font-weight: bold;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .post-content {
            font-size: 14px;
            margin-bottom: 12px;
            word-break: break-word;
            line-height: 1.4;
            color: #d1d5db;
        }
        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
        /* Кнопка лайка с микро-анимацией сердцебиения */
        .like-btn {
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 16px;
            width: auto;
            margin: 0;
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s, transform 0.2s ease;
        }
        .like-btn:active {
            transform: scale(1.3); /* Эффект пульсации сердечка при клике */
        }
        .like-btn:hover {
            background: rgba(255, 71, 87, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка профиля -->
        <div class="profile-header">
            <div class="profile-info">
                <div class="avatar">
                    <div class="avatar-inner">📸</div>
                </div>
                <div>
                    <div id="userName" style="font-weight: bold; font-size: 15px;">Фотограф</div>
                    <div style="font-size: 11px; color: var(--text-muted);">@id<span id="userIdDisplay">0</span></div>
                </div>
            </div>
            <div class="stats">
                <div>
                    <div class="stat-num" id="postsCount">0</div>
                    <div style="color: var(--text-muted);">постов</div>
                </div>
                <div>
                    <div class="stat-num" id="followersCount">0</div>
                    <div style="color: var(--text-muted);">подписчики</div>
                </div>
                <div>
                    <div class="stat-num" id="followingCount">0</div>
                    <div style="color: var(--text-muted);">подписки</div>
                </div>
            </div>
        </div>

        <!-- Создание публикации -->
        <div class="create-post">
            <h3 style="margin: 0 0 8px 0; font-size: 15px; color: var(--text-muted);">✨ Новая публикация</h3>
            <input type="text" id="postTitle" placeholder="Имя вашего персонажа">
            <textarea id="postText" placeholder="Поделитесь моментами из жизни штата..." rows="2"></textarea>
            <button onclick="createPost()">Поделиться фото/историей</button>
        </div>

        <!-- Лента -->
        <div id="feed">
            <p style="text-align: center; color: var(--text-muted);">Загрузка ленты...</p>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 12345;
        const userNameTg = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "Игрок";
        
        document.getElementById('userIdDisplay').innerText = userId;
        document.getElementById('userName').innerText = userNameTg;
        document.getElementById('postTitle').value = userNameTg;

        const RENDER_API_URL = 'https://my-telegram-bot-vo4s.onrender.com';

        function loadProfileAndFeed() {
            fetch(`${RENDER_API_URL}/api/social/profile?user_id=${userId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('followersCount').innerText = data.followers;
                        document.getElementById('followingCount').innerText = data.following;
                        document.getElementById('postsCount').innerText = data.posts_count;
                    }
                })
                .catch(err => console.log('Профиль загружается...'));

            fetch(`${RENDER_API_URL}/api/social/feed`)
                .then(res => res.json())
                .then(data => {
                    const feedDiv = document.getElementById('feed');
                    if (!data.posts || data.posts.length === 0) {
                        feedDiv.innerHTML = '<p style="text-align: center; color: var(--text-muted);">В ленте пока пусто. Опубликуйте первую историю!</p>';
                        return;
                    }
                    
                    feedDiv.innerHTML = '';
                    data.posts.forEach(post => {
                        const postEl = document.createElement('div');
                        postEl.className = 'post';
                        postEl.innerHTML = `
                            <div class="post-author">👤 ${post.author}</div>
                            <div class="post-content">${post.text}</div>
                            <div class="post-actions">
                                <button class="like-btn" onclick="likePost(${post.id})">❤️ <span id="likes-${post.id}">${post.likes}</span></button>
                                <span style="font-size: 11px; color: var(--text-muted);">${post.date}</span>
                            </div>
                        `;
                        feedDiv.appendChild(postEl);
                    });
                })
                .catch(err => {
                    document.getElementById('feed').innerHTML = '<p style="text-align: center; color: #ff4757;">Сервер соцсети просыпается...</p>';
                });
        }

        function createPost() {
            const author = document.getElementById('postTitle').value.trim();
            const text = document.getElementById('postText').value.trim();

            if (!text) {
                alert('Напишите что-нибудь для публикации!');
                return;
            }

            fetch(`${RENDER_API_URL}/api/social/post`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, author: author, text: text })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('postText').value = '';
                    loadProfileAndFeed();
                }
            });
        }

        function likePost(postId) {
            fetch(`${RENDER_API_URL}/api/social/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ post_id: postId, user_id: userId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById(`likes-${postId}`).innerText = data.likes;
                }
            });
        }

        loadProfileAndFeed();
        setInterval(loadProfileAndFeed, 10000);
    </script>
</body>
</html>
