<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plaza.World - Жалобы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f0f0f; color: #ffffff; padding: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .title-block h1 { font-size: 18px; font-weight: 700; }
        .title-block p { font-size: 11px; color: #888; letter-spacing: 1px; margin-top: 2px; }
        .btn-add { background-color: #f2f0eb; color: #000; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
        
        /* Фильтры */
        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-chip { background-color: #1a1a1a; color: #aaa; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }
        .filter-chip.active { background-color: #f2f0eb; color: #000; font-weight: 600; }

        /* Модальное окно формы */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); padding: 20px; overflow-y: auto; z-index: 100; }
        .modal-content { background: #161616; border: 1px solid #222; border-radius: 16px; padding: 20px; margin-top: 20px; }
        .modal-content h3 { margin-bottom: 15px; font-size: 16px; color: #f2f0eb; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group textarea { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 10px; color: #fff; font-size: 13px; }
        .form-group textarea { resize: vertical; height: 80px; }
        .btn-submit { width: 100%; background: #f2f0eb; color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; margin-top: 10px; cursor: pointer; }
        .btn-close { width: 100%; background: transparent; color: #888; border: none; padding: 10px; margin-top: 5px; cursor: pointer; font-size: 13px; }

        /* Карточки */
        .card { background-color: #161616; border: 1px solid #222; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .avatar-badge { background-color: #222; color: #f2f0eb; font-size: 11px; font-weight: bold; padding: 6px 8px; border-radius: 8px; }
        .username { font-size: 14px; font-weight: 600; }
        .status-badge { background-color: #332b1a; color: #d4af37; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
        .violation-type { font-size: 12px; color: #888; margin-bottom: 8px; }
        .card-text { font-size: 13px; color: #ccc; line-height: 1.4; margin-bottom: 12px; }
        .card-footer { border-top: 1px solid #222; padding-top: 10px; display: flex; justify-content: space-between; font-size: 11px; color: #777; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-block">
            <h1>Plaza.World</h1>
            <p>ЖАЛОБЫ</p>
        </div>
        <button class="btn-add" onclick="openModal()">+ Подать</button>
    </div>

    <!-- Фильтры -->
    <div class="filters" id="filters">
        <button class="filter-chip active" onclick="filterCards('all', this)">Все</button>
        <button class="filter-chip" onclick="filterCards('pending', this)">На рассмотрении</button>
        <button class="filter-chip" onclick="filterCards('accepted', this)">Принято</button>
        <button class="filter-chip" onclick="filterCards('rejected', this)">Отклонено</button>
    </div>

    <!-- Список жалоб -->
    <div id="complaints-list">
        <div class="card">
            <div class="card-header">
                <div class="user-info">
                    <div class="avatar-badge">НФ</div>
                    <div class="username">на фото ник</div>
                </div>
                <div class="status-badge">НА РАССМОТРЕНИИ</div>
            </div>
            <div class="violation-type">бан домам не юзает ис оски в нрп чате</div>
            <div class="card-text">
                Я зашел в дом она начала меня кидать тележкой и банить...
            </div>
            <div class="card-footer">
                <span>🕒 08.09.2026</span>
                <span>💬 0</span>
            </div>
        </div>
    </div>

    <!-- Модальное окно подачи жалобы -->
    <div id="complaintModal" class="modal">
        <div class="modal-content">
            <h3>Подать жалобу</h3>
            <div class="form-group">
                <label>Ваш никнейм:</label>
                <input type="text" id="senderNick" placeholder="Ваш ник в игре">
            </div>
            <div class="form-group">
                <label>Ник нарушителя:</label>
                <input type="text" id="targetNick" placeholder="Кого жаловаться">
            </div>
            <div class="form-group">
                <label>Опишите ситуацию:</label>
                <textarea id="situation" placeholder="Опишите подробно, когда это произошло..."></textarea>
            </div>
            <div class="form-group">
                <label>Ссылка на скриншот (Imgur / фото):</label>
                <input type="text" id="screenshotUrl" placeholder="https://imgur.com/...">
            </div>
            <button class="btn-submit" onclick="submitComplaint()">Отправить жалобу</button>
            <button class="btn-close" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function openModal() {
            document.getElementById('complaintModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('complaintModal').style.display = 'none';
        }

        function submitComplaint() {
            const sender = document.getElementById('senderNick').value;
            const target = document.getElementById('targetNick').value;
            const situation = document.getElementById('situation').value;
            const screenshot = document.getElementById('screenshotUrl').value;

            if (!sender || !target || !situation) {
                alert("Пожалуйста, заполните основные поля!");
                return;
            }

            // Формируем данные для отправки боту в Telegram
            const complaintData = {
                type: "new_complaint",
                sender: sender,
                target: target,
                situation: situation,
                screenshot: screenshot
            };

            // Передаем данные боту и закрываем приложение
            tg.sendData(JSON.stringify(complaintData));
        }

        // Переключение фильтров
        function filterCards(category, element) {
            document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
