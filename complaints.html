<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жалобы и предложения - GreeLand</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #f43f5e;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }
        h2 { text-align: center; color: var(--accent-color); }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        textarea, select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-color);
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚨 Жалобы и предложения</h2>
        <form id="complaint-form">
            <label>Тип обращения:</label>
            <select id="type">
                <option value="Жалоба на игрока">Жалоба на игрока</option>
                <option value="Баг / Ошибка">Баг или ошибка</option>
                <option value="Предложение">Идея / Предложение</option>
            </select>

            <label>Опишите суть проблемы или идеи:</label>
            <textarea id="text" rows="5" required placeholder="Введите подробности..."></textarea>

            <button type="submit">Отправить обращение</button>
        </form>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('complaint-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                type: "complaint",
                category: document.getElementById('type').value,
                text: document.getElementById('text').value
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
