<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plaza.World - Жалобы</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding: 12px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .title-block h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .title-block p {
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .btn-add {
            background-color: #f2f0eb;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        /* Горизонтальный скролл фильтров */
        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar {
            display: none;
        }
        .filter-chip {
            background-color: #1a1a1a;
            color: #aaa;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }
        .filter-chip.active {
            background-color: #f2f0eb;
            color: #000;
            font-weight: 600;
        }
        /* Карточки жалоб */
        .card {
            background-color: #161616;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .avatar-badge {
            background-color: #222;
            color: #f2f0eb;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 8px;
            border-radius: 8px;
        }
        .username {
            font-size: 14px;
            font-weight: 600;
        }
        .status-badge {
            background-color: #332b1a;
            color: #d4af37;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }
        .violation-type {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }
        .card-text {
            font-size: 13px;
            color: #ccc;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .card-footer {
            border-top: 1px solid #222;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-block">
            <h1>Plaza.World</h1>
            <p>ЖАЛОБЫ</p>
        </div>
        <button class="btn-add" onclick="openModal()">+ Подать</button>
    </div>

    <!-- Фильтры -->
    <div class="filters">
        <button class="filter-chip active">Все</button>
        <button class="filter-chip">На рассмотрении</button>
        <button class="filter-chip">В проверке</button>
        <button class="filter-chip">Принято</button>
        <button class="filter-chip">Отклонено</button>
    </div>

    <!-- Список жалоб (пример карточки) -->
    <div class="card">
        <div class="card-header">
            <div class="user-info">
                <div class="avatar-badge">НФ</div>
                <div class="username">на фото ник</div>
            </div>
            <div class="status-badge">НА РАССМОТРЕНИИ</div>
        </div>
        <div class="violation-type">бан домам не юзает ис оски в нрп чате</div>
        <div class="card-text">
            Я зашел в дом она начала меня кидать тележкой и банить потом каким то хуеп... девушка 16 лет взяла на плечо 80 кг парня...
        </div>
        <div class="card-footer">
            <span>🕒 08.09.2026</span>
            <span>💬 0</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем мини-приложение на весь экран

        function openModal() {
            // Здесь можно будет сделать открытие формы подачи жалобы
            alert("Функция подачи жалобы в разработке!");
        }
    </script>
</body>
</html>
